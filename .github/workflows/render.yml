name: Render
run-name: inkrender ${{ inputs.job }}

# Started only by Inkrender. Renders a film-packer ZIP: one runner per chunk, then one runner joins
# the chunks, adds the narration and saves the film to the Drive folder picked in Inkrender.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Inkrender render id
        required: true
        type: string
      api:
        description: Inkrender base URL
        required: true
        type: string
      chunks:
        description: 'Chunk ids as JSON, e.g. ["01","02"]'
        required: true
        type: string

permissions:
  id-token: write   # the OIDC token is how runners prove themselves to Inkrender
  contents: write   # read the render ZIP from / leave the film in the job's draft release
  actions: read

env:
  API: ${{ inputs.api }}
  JOB: ${{ inputs.job }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch, check and seal the package
        run: bash scripts/prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: package/package.enc
          retention-days: 2
          compression-level: 0

  chunk:
    name: Chunk ${{ matrix.chunk }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - name: Render chunk ${{ matrix.chunk }}
        run: bash scripts/chunk.sh "${{ matrix.chunk }}"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: result/chunk-${{ matrix.chunk }}.enc
          retention-days: 2
          compression-level: 0

  finish:
    name: Join and save
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Make room for a long film
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" | tail -n 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Join, verify and save to Drive
        run: bash scripts/finish.sh
